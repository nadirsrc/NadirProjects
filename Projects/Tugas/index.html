<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MisaBot - Tugas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0A0A0B;
            --card: #111111;
            --border: #2a2a2a;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #64748B;
            --accent-hover: #475569;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            animation: pageFadeIn 0.3s ease;
        }
        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        /* Logo with Icon */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, #9b8aff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(100, 116, 139, 0.35);
        }
        .logo-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }
        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .logo-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .logo-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .feature svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .feature span {
            font-size: 13px;
            color: var(--text);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent) 0%, #6b5bd6 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 14px;
            margin-top: 32px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(100, 116, 139, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .brand {
            text-align: center;
            margin-top: 48px;
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-title">Tugas</span>
                <span class="logo-subtitle">XII RPL 1</span>
            </div>
        </div>

        <h1>Tambah Tugas</h1>
        <p>Sistem informasi tugas untuk kelas XII RPL 1 dengan deadline otomatis.</p>

        <div class="features">
            <div class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span>Pilih mapel dari daftar guru</span>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>Deadline otomatis berdasarkan jadwal</span>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>Lampirkan foto tugas</span>
            </div>
        </div>

        <a href="tugas.html" class="btn">Mulai</a>

        <p class="brand">XII RPL 1 2026/2027</p>
    </div>
</body>
</html>
